id = "monkey-c"
name = "Monkey C"
version = "0.0.1"
schema_version = 1
authors = ["hieudoanm"]
description = "Monkey C and Jungle syntax highlighting, formatting, theme, icons, and Connect IQ runtime preview for Garmin Connect IQ."
repository = "https://github.com/hieudoanm/monkey"

[grammars.monkeyc]
repository = "https://github.com/DuckSoft/tree-sitter-monkeyc"
rev = "f361cf8bf1be8c7d67b2255a4f8d1a394baf9dd2"

[grammars.jungle]
repository = "https://github.com/hieudoanm/monkey"
rev = "master"
path = "packages/extensions/zed/grammars/tree-sitter-jungle"

# Registers `monkey lsp` as a language server for both languages. Zed spawns
# the binary configured under `lsp.monkey.binary` in settings.json — see
# README.md "Language server" for the settings snippet.
[language_servers.monkey-lsp]
name = "monkey"
languages = ["Monkey C", "Jungle"]
