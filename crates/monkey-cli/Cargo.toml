monkey-mcp = { path = "../monkey-mcp" }
monkey-parser = { path = "../monkey-parser" }
monkey-project = { path = "../monkey-project" }
monkey-sdk = { path = "../monkey-sdk" }
monkey-syntax = { path = "../monkey-syntax" }
